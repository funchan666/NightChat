name: NightChat
options:
  bundleIdPrefix: com.sittinglamp
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: en
  xcodeVersion: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    DEVELOPMENT_TEAM: JPTS6M4T5B
    CODE_SIGN_IDENTITY: "iPhone Developer"
targets:
  NightChat:
    type: application
    platform: iOS
    sources:
      - path: AfterglowKeep
        excludes:
          - "**/*.md"
      - path: assets/pics
        type: folder
        buildPhase: resources
      - path: assets/videos
        type: folder
        buildPhase: resources
    dependencies:
      - sdk: StoreKit.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sittinglamp.nightdesk
        INFOPLIST_FILE: AfterglowKeep/Info.plist
        PRODUCT_NAME: NightChat
        CODE_SIGN_ENTITLEMENTS: AfterglowKeep/NightChat.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: false
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_EMIT_LOC_STRINGS: false
        INFOPLIST_KEY_CFBundleDisplayName: NightChat
        INFOPLIST_KEY_UILaunchStoryboardName: LaunchScreen
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    scheme:
      testTargets: []
